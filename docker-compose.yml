services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estafaradar
      POSTGRES_PASSWORD: change_me_local_only
      POSTGRES_DB: estafaradar
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estafaradar"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://estafaradar:change_me_local_only@postgres:5432/estafaradar
      ALLOWED_ORIGINS: http://localhost:5173
      STORE_ANALYSES: "false"
      BROWSER_INSPECTION: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
